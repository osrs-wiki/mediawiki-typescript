name: Push Main

on:
  push:
    branches:
      - main

jobs:
  lint_build_test:
    name: "Lint, Build, & Test"
    uses: ./.github/workflows/action-lint-build-test.yml
    secrets: inherit

  changeset:
    name: "Changeset"
    needs: lint_build_test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PACKAGES }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          always-auth: true
          node-version: 22

      - name: Install npm packages
        run: npm ci

      - name: Create Release Pull Request or Release
        id: changeset
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version
          title: Version Release
          commit: Version Release
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_PACKAGES }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
